<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DZPOS - النظام المركزي لإدارة التراخيص والمنتجات</title>
    <meta name="description" content="النظام السحابي المركزي لتطبيق كاسة DZPOS: إدارة الزبائن، التراخيص، ملفات المنتجات، والمزامنة بدون إنترنت." />
    
    <!-- Google Fonts: Alexandria & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Window.fetch accessor safety shim for sandboxed environments -->
    <script>
      (function() {
        try {
          const nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          let currentFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch shim notice:', e);
        }
      })();
    </script>
  </head>
  <body class="bg-[#050505] text-zinc-100 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
